<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="web_standard" name="shell-type"/>
<title>Axon — Context that follows every AI you use</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
@layer base {
html, body {
margin: 0;
padding: 0;
background-color: #000000;
color: #ededed;
font-family: 'Geist', sans-serif;
}
body { overscroll-behavior: none; }
::-webkit-scrollbar { display: none; }
}
.grid-bg {
background-size: 40px 40px;
background-image:
linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
}
.radial-mask {
mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, #000 60%, transparent 100%);
-webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, #000 60%, transparent 100%);
}
/* Ambient Drifting Aura */
@keyframes auraDrift {
0%, 100% { transform: translate(-50%, -10%) scale(1); opacity: 0.22; }
50% { transform: translate(-46%, -4%) scale(1.08); opacity: 0.32; }
}
.animate-aura {
animation: auraDrift 14s ease-in-out infinite;
}
/* Interactive Beam / Particle Pulse */
@keyframes beamFlow {
0% { transform: translateX(-100%); opacity: 0; }
40% { opacity: 1; }
80% { opacity: 1; }
100% { transform: translateX(200%); opacity: 0; }
}
.animate-beam {
animation: beamFlow 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
/* Marquee Infinite Loop */
@keyframes marquee {
0% { transform: translateX(0); }
100% { transform: translateX(-50%); }
}
.animate-marquee {
display: flex;
width: max-content;
animation: marquee 32s linear infinite;
}
.animate-marquee:hover {
animation-play-state: paused;
}
/* Reveal-on-scroll base styles */
.reveal-on-scroll {
opacity: 0;
transform: translateY(22px);
transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
will-change: opacity, transform;
}
.reveal-on-scroll.revealed {
opacity: 1;
transform: translateY(0);
}
/* Accordion transition utility */
.faq-answer {
max-height: 0;
opacity: 0;
overflow: hidden;
transition: max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
}
.faq-item.active .faq-answer {
max-height: 180px;
opacity: 1;
}
.faq-item.active .faq-icon {
transform: rotate(45deg);
}
@media (prefers-reduced-motion: reduce) {
.reveal-on-scroll {
opacity: 1 !important;
transform: none !important;
transition: none !important;
}
.animate-marquee, .animate-aura, .animate-beam {
animation: none !important;
}
}
</style>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

tailwind.config = {

theme: {
extend: {
colors: {

"surface-subtle": "#121212",

"surface-container": "#1f1f1f",

"border-hairline": "rgba(255, 255, 255, 0.08)",
"border-medium": "rgba(255, 255, 255, 0.16)",
"primary": "#6f9bff",
"primary-fixed": "#d7e6ff",
"primary-container": "#2f6fe0",
"secondary": "#b7c0d6",
"signal-amber": "#f5b14a",
"signal-red": "#ff6b6b",
"text-main": "#ededed",
"text-muted": "#a1a1a1",
"text-soft": "#707070",
},
fontFamily: {
sans: ["Geist", "sans-serif"],
mono: ["JetBrains Mono", "monospace"],
}
}
}
};
</script>
